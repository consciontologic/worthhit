name: Packages and release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plain MAJOR.MINOR.PATCH matching main (leave empty for artifacts only)'
        type: string
        default: ''
env:
  WORTHHIT_RELEASE_VERSION: ${{ inputs.version }}
permissions:
  contents: read
  actions: read
concurrency:
  group: worthhit-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require version, promoted develop content and validated source
        if: inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tool/ci-step.sh 'Prior source validation' python3 tool/release_guard.py source
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-3.47.3-${{ hashFiles('pubspec.lock') }}
      - run: tool/ci-step.sh 'Dependencies' make deps
      - run: tool/ci-step.sh 'Build the approved static source once' make build.public
      - run: tool/ci-step.sh 'Version and archive' make release.prepare
      - run: tool/ci-step.sh 'Build and save versioned image once' make image
      - name: Preflight immutable release identity
        if: inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tool/ci-step.sh 'Release preflight' python3 tool/release.py preflight
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worthhit-release-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    environment:
      name: production
      url: https://worthhit.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify human approval receipt and current source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tool/ci-step.sh 'Human release receipt' python3 tool/release_guard.py approval
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worthhit-release-${{ github.sha }}
          path: build/release/
      - run: tool/ci-step.sh 'Verify exact approved bytes' python3 tool/release.py verify --extract build/web
      - name: Authenticate scoped package publisher
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: printf '%s' "$PACKAGE_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Preflight release and package conflicts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tool/ci-step.sh 'Immutable release check' python3 tool/release.py preflight
          tool/ci-step.sh 'Immutable package check' python3 tool/container.py preflight
      - name: Publish approved immutable package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tool/ci-step.sh 'Publish GHCR version' python3 tool/container.py publish
      - name: Publish managed website artifacts by GitOps
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORTHHIT_DEPLOY_KEY: ${{ secrets.WORTHHIT_DEPLOY_KEY }}
        run: tool/ci-step.sh 'Publish worthhit.com' python3 tool/publish_website.py build/web
      - name: Publish plain SemVer tag and immutable release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tool/ci-step.sh 'Publish GitHub release' python3 tool/release.py publish
      - name: Log out of package registry
        if: always()
        run: docker logout ghcr.io
