server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    include /etc/nginx/headers.conf;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /config/ { return 404; }
    location ~ /\. { return 404; }
    location ~ \.map$ { return 404; }
    # Asset misses stay 404, so they cannot install HTML into an offline cache.
    location ~ /$ { try_files ${uri}index.html =404; }
    location / { try_files $uri =404; }
}
