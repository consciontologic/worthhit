worker_processes auto;
pid /tmp/nginx.pid;
# nginx error messages can contain raw request URLs. Access logs below are
# intentionally the only request log; startup/health checks report failures.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # No URI, query string, request header, user input or API key in access logs.
    log_format safe '$request_method $status $body_bytes_sent';
    access_log /dev/stdout safe;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    include /etc/nginx/server.conf;
}
