name: worthhit
description: Simple product price estimates with free models, optional web research and supported images or video.
publish_to: none
version: 2.0.0
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.3'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  http: ^1.6.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/appraisal_system_v1.txt
    - assets/appraisal_system_v2.txt
    - assets/brand/
  fonts:
    - family: WorthhitIcons
      fonts:
        - asset: assets/icons/WorthhitIcons.ttf
    - family: WorthhitDisplay
      fonts:
        - asset: assets/fonts/SpaceGrotesk.woff2
    - family: WorthhitSans
      fonts:
        - asset: assets/fonts/NotoSans.woff2
    - family: WorthhitArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.woff2
    - family: WorthhitChinese
      fonts:
        - asset: assets/fonts/NotoSansSC.woff2
