name: worthit
description: Evidence-led second-hand price estimates, made for real-world deals.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.3'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/appraisal_system_v1.txt
  fonts:
    - family: WorthitSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
